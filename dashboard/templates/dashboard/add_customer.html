<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naya Grahak Jodein</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Top Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 p-4">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <a href="{% url 'dashboard_home' %}" class="text-slate-400 hover:text-white text-xl">⬅️</a>
            <h1 class="text-lg font-bold text-emerald-400">👤 Naya Grahak Jodein</h1>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-md mx-auto p-4">
        <form method="POST" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-xl">
            {% csrf_token %}

            <!-- Name -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Grahak ka Naam</label>
                <input type="text" name="name" required placeholder="e.g. Sandeep Sahu" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">WhatsApp / Phone Number</label>
                <input type="text" name="phone_number" required placeholder="e.g. 98765XXXXX" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Village / Area -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Gaon ya Area</label>
                <input type="text" name="village_or_area" required placeholder="e.g. Katni / Bijeraghogarh" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Buying Frequency Circle -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Maal ka Gap (Buying Frequency)</label>
                <select name="buying_frequency_days" required class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-emerald-500">
                    <option value="1">Har 1 Din me</option>
                    <option value="2">Har 2 Din me</option>
                    
                    <option value="7">Har 1 Hafte me (7 Din)</option>
                    <option value="10">Har 10 Din me</option>
                    <option value="15" selected>Har 15 Din me (Aadha Mahina)</option>
                    <option value="20">Har 20 Din me</option>
                    <option value="30">Har 30 Din me (Mahina)</option>
                </select>
                <p class="text-[10px] text-slate-400 mt-1">💡 Iske hisab se dashboard bataega ki customer ko kab call karna hai.</p>
            </div>

            <!-- Default Fixed Rates (Dynamic Pricing) -->
            <div class="border-t border-slate-700/60 pt-3 space-y-3">
                <p class="text-xs font-bold text-amber-400">💰 Fix Rate (Gaon/Transport ke hisab se)</p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Kati Supari Rate</label>
                        <input type="number" step="0.01" name="default_rate_kati" placeholder="0.00" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Khadi Supari Rate</label>
                        <input type="number" step="0.01" name="default_rate_khadi" placeholder="0.00" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg mt-2">
                👤 Grahak Save Karein
            </button>
        </form>
    </div>

</body>
</html>
