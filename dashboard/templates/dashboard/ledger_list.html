<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grahak Khata Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="{% url 'dashboard_home' %}" class="text-slate-400 hover:text-white text-xl">⬅️</a>
                <h1 class="text-lg font-bold text-emerald-400">📖 Grahak Khata Ledger</h1>
            </div>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Sabhi Grahako ki list aur Baqi Udhari</p>
        
        <div class="space-y-3">
            {% for item in ledger_data %}
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center shadow-md">
                <div>
                    <h3 class="font-bold text-slate-200">{{ item.customer.name }}</h3>
                    <p class="text-xs text-slate-400 mt-0.5">📍 {{ item.customer.village_or_area }}</p>
                </div>
                <div class="text-right flex items-center gap-4">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-medium">Kul Udhari</p>
                        <p class="text-base font-bold {% if item.total_due > 0 %}text-rose-400{% else %}text-emerald-400{% endif %}">
                            ₹{{ item.total_due }}
                        </p>
                    </div>
                    {% if item.total_due > 0 %}
                    <a href="{% url 'collect_payment' item.customer.id %}" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
                        💵 Jama
                    </a>
                    {% endif %}
                </div>
            </div>
            {% empty %}
            <p class="text-xs text-slate-500 text-center py-8">Koi grahak nahi mila.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
