<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udhari Jama Karein</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <nav class="bg-slate-800 border-b border-slate-700 p-4">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <a href="{% url 'ledger_list' %}" class="text-slate-400 hover:text-white text-xl">⬅️</a>
            <h1 class="text-lg font-bold text-emerald-400">💵 Udhari Vasooli / Jama</h1>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-xl">
            
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-200 text-base">{{ customer.name }}</h2>
                    <p class="text-xs text-slate-400 mt-0.5">📍 {{ customer.village_or_area }}</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase font-medium">Baqi Rashi</p>
                    <p class="text-xl font-bold text-rose-400">₹{{ total_due }}</p>
                </div>
            </div>

            <form method="POST" class="space-y-4 pt-2">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kitna Paisa Mila?</label>
                    <input type="number" step="0.01" name="amount_received" max="{{ total_due }}" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-slate-200 font-bold text-lg text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Remarks / Note (Optional)</label>
                    <textarea name="remarks" rows="2" placeholder="e.g. Aadha paisa diya, baki agle hafte bole hain" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg">
                    ✅ Cash Receive & Update Ledger
                </button>
            </form>
        </div>
    </div>

</body>
</html>
